[project]
name = "bistmd"
version = "0.1.0"
description = "Early detection of stock market manipulation on Borsa Istanbul from daily market and KAP data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melih Erdem Koçoğlu" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=15",
    "tabulate>=0.9",
    "pymupdf>=1.24",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
