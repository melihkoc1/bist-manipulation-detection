[project]
name = "bistmd"
version = "0.1.0"
description = "BIST'te piyasa bozucu eylemlerin günlük piyasa ve KAP verisiyle erken tespiti"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=15",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
